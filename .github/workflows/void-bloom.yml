name: VOID BLOOM standalone game checks
on:
  push:
    branches: [main]
    paths:
      - 'void-bloom.html'
      - 'tests/void-bloom.cjs'
      - '.github/workflows/void-bloom.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright@1.56.1
      - name: Test original VOID BLOOM game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/void-http.log 2>&1 &
          sleep 2
          node tests/void-bloom.cjs
      - name: Save desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: void-bloom-preview
          path: |
            void-bloom-desktop.png
            void-bloom-mobile.png
