<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Clash Legends: Arena</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10142c;color:white;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;text-shadow:0 2px 3px #111;font-weight:900}#menu{position:fixed;inset:0;background:linear-gradient(135deg,#282b86,#7834a6);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}#panel{max-width:480px}h1{font-size:clamp(32px,8vw,64px);line-height:1;margin:10px 0;color:#ffe36b;text-shadow:4px 5px #1a1750}button{border:0;border-radius:14px;background:#ffcb3b;color:#222;padding:14px 24px;font-size:20px;font-weight:900;box-shadow:0 5px #b67c13;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 2px #b67c13}.sub{color:#e9dcff}#touch{position:fixed;inset:0;pointer-events:none;display:none}#stick,#fire,#super{position:absolute;bottom:30px;border-radius:50%;pointer-events:auto;touch-action:none;user-select:none}#stick{left:25px;width:120px;height:120px;border:4px solid #ffffff88;background:#ffffff28}#knob{position:absolute;left:39px;top:39px;width:34px;height:34px;background:#fff9;border-radius:50%}#fire{right:26px;width:94px;height:94px;background:#f04d68b9;border:4px solid #fff8;display:grid;place-items:center;font-size:32px}#super{right:130px;bottom:38px;width:65px;height:65px;background:#ffce30c9;border:3px solid #fff8;display:grid;place-items:center;font-size:25px}#status{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:13px;color:#fff9;pointer-events:none}@media(pointer:coarse){#touch{display:block}#status{display:none}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div id="health">❤️ 100</div><div id="score">⭐ 0 &nbsp; 💀 0</div><div id="wave">WAVE 1</div></div><div id="touch"><div id="stick"><div id="knob"></div></div><div id="super">⚡</div><div id="fire">🎯</div></div><div id="status">WASD move · Mouse aim · Click shoot · Space Super</div><div id="menu"><div id="panel"><div style="font-size:52px">⚡🏆⚡</div><h1>CLASH LEGENDS<br>ARENA</h1><p class="sub">An original colorful arena shooter. Defeat bots, dodge attacks and survive the waves!</p><p>💻 Laptop + 📱 Mobile</p><button id="start">PLAY NOW</button><p class="sub" style="font-size:13px">Prototype: solo practice mode. Online modes and accounts are not yet available.</p></div></div>
<script>
(()=>{'use strict';
const c=document.querySelector('#game'),x=c.getContext('2d'),menu=document.querySelector('#menu'),hpEl=document.querySelector('#health'),scoreEl=document.querySelector('#score'),waveEl=document.querySelector('#wave');
let w=0,h=0,scale=1,worldW=1100,worldH=750,playing=false,hero,bots=[],shots=[],particles=[],walls=[],score=0,kills=0,wave=1,spawnClock=0,fireClock=0,keys={},mouse={x:0,y:0,down:false},touchMove={x:0,y:0},touchAim={x:1,y:0},touchFire=false,last=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;scale=Math.min(w/worldW,h/worldH); }addEventListener('resize',resize);resize();
function reset(){hero={x:worldW/2,y:worldH/2,r:22,hp:100,max:100,speed:245,super:0,inv:0};bots=[];shots=[];particles=[];walls=[{x:220,y:165,w:140,h:52},{x:740,y:165,w:140,h:52},{x:220,y:530,w:140,h:52},{x:740,y:530,w:140,h:52},{x:480,y:130,w:140,h:52},{x:480,y:570,w:140,h:52}];score=0;kills=0;wave=1;spawnClock=0;fireClock=0;playing=true;menu.style.display='none';for(let i=0;i<4;i++)spawnBot()}
function spawnBot(){let a=rand(0,Math.PI*2),d=rand(300,440);bots.push({x:clamp(hero.x+Math.cos(a)*d,40,worldW-40),y:clamp(hero.y+Math.sin(a)*d,40,worldH-40),r:20,hp:55+wave*8,max:55+wave*8,shoot:rand(.5,2),speed:65+wave*4,side:Math.random()<.5?1:-1})}
function hitWall(o){return walls.some(q=>o.x+o.r>q.x&&o.x-o.r<q.x+q.w&&o.y+o.r>q.y&&o.y-o.r<q.y+q.h)}
function move(o,dx,dy){let ox=o.x;o.x=clamp(o.x+dx,o.r,worldW-o.r);if(hitWall(o))o.x=ox;let oy=o.y;o.y=clamp(o.y+dy,o.r,worldH-o.r);if(hitWall(o))o.y=oy}
function shoot(o,angle,enemy=false,power=1){shots.push({x:o.x+Math.cos(angle)*28,y:o.y+Math.sin(angle)*28,vx:Math.cos(angle)*(enemy?330:560),vy:Math.sin(angle)*(enemy?330:560),r:enemy?7:8,damage:enemy?10:25*power,life:1.8,enemy})}
function burst(px,py,color,n=12){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(30,180);particles.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.2,.6),color})}}
function aim(){if(touchFire){return Math.atan2(touchAim.y,touchAim.x)}let rect=c.getBoundingClientRect(),sx=(mouse.x*devicePixelRatio-(w-worldW*scale)/2)/scale,sy=(mouse.y*devicePixelRatio-(h-worldH*scale)/2)/scale;return Math.atan2(sy-hero.y,sx-hero.x)}
function superAttack(){if(!playing||hero.super<100)return;hero.super=0;for(let i=0;i<18;i++)shoot(hero,i*Math.PI/9,false,1.7);burst(hero.x,hero.y,'#ffdb39',30)}
function update(dt){if(!playing)return;hero.inv=Math.max(0,hero.inv-dt);fireClock-=dt;let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+touchMove.x,dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+touchMove.y;let mag=Math.hypot(dx,dy);if(mag>1){dx/=mag;dy/=mag}move(hero,dx*hero.speed*dt,dy*hero.speed*dt);if((mouse.down||touchFire)&&fireClock<=0){shoot(hero,aim());fireClock=.23}
for(let b of bots){let d=dist(b,hero),a=Math.atan2(hero.y-b.y,hero.x-b.x);if(d>170)move(b,Math.cos(a)*b.speed*dt,Math.sin(a)*b.speed*dt);else if(d<125)move(b,-Math.cos(a)*b.speed*.5*dt,-Math.sin(a)*b.speed*.5*dt);else move(b,-Math.sin(a)*b.side*b.speed*.5*dt,Math.cos(a)*b.side*b.speed*.5*dt);b.shoot-=dt;if(b.shoot<=0&&d<540){shoot(b,a+rand(-.14,.14),true);b.shoot=rand(1.15,2.1)}}
for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.x<0||s.y<0||s.x>worldW||s.y>worldH||hitWall(s)){s.life=0;continue}if(s.enemy){if(dist(s,hero)<s.r+hero.r&&hero.inv<=0){hero.hp-=s.damage;hero.inv=.2;s.life=0;burst(s.x,s.y,'#ff6979',5)}}else{for(let b of bots){if(b.hp>0&&dist(s,b)<s.r+b.r){b.hp-=s.damage;s.life=0;burst(s.x,s.y,'#ffd05c',6);if(b.hp<=0){kills++;score+=100;hero.super=Math.min(100,hero.super+18);burst(b.x,b.y,'#b36dff',18)}break}}}}
shots=shots.filter(s=>s.life>0);bots=bots.filter(b=>b.hp>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
if(bots.length===0){wave++;hero.hp=Math.min(100,hero.hp+20);for(let i=0;i<Math.min(3+wave,12);i++)spawnBot()}if(hero.hp<=0){playing=false;menu.style.display='flex';document.querySelector('#panel').innerHTML='<h1>GAME OVER</h1><p>⭐ Score: '+score+' · 💀 KOs: '+kills+' · Wave: '+wave+'</p><button id="again">PLAY AGAIN</button>';document.querySelector('#again').onclick=reset}
hpEl.textContent='❤️ '+Math.max(0,Math.ceil(hero.hp))+'   ⚡ '+Math.floor(hero.super)+'%';scoreEl.textContent='⭐ '+score+'   💀 '+kills;waveEl.textContent='WAVE '+wave}
function roundRect(px,py,pw,ph,r,color){x.fillStyle=color;x.beginPath();x.roundRect(px,py,pw,ph,r);x.fill()}
function draw(){x.clearRect(0,0,w,h);x.fillStyle='#11142b';x.fillRect(0,0,w,h);x.save();x.translate((w-worldW*scale)/2,(h-worldH*scale)/2);x.scale(scale,scale);x.fillStyle='#70c96c';x.fillRect(0,0,worldW,worldH);x.strokeStyle='#ffffff17';x.lineWidth=2;for(let i=0;i<worldW;i+=50){x.beginPath();x.moveTo(i,0);x.lineTo(i,worldH);x.stroke()}for(let i=0;i<worldH;i+=50){x.beginPath();x.moveTo(0,i);x.lineTo(worldW,i);x.stroke()}x.strokeStyle='#397d46';x.lineWidth=16;x.strokeRect(8,8,worldW-16,worldH-16);
for(let q of walls){roundRect(q.x+4,q.y+8,q.w,q.h,9,'#6b433e');roundRect(q.x,q.y,q.w,q.h,9,'#b57651');roundRect(q.x+5,q.y+5,q.w-10,12,4,'#dc9e6b')}
for(let s of shots){x.fillStyle=s.enemy?'#ff5367':'#ffe64a';x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill()}
for(let b of bots){x.fillStyle='#5b215f';x.beginPath();x.arc(b.x+3,b.y+6,b.r+3,0,7);x.fill();x.fillStyle='#f15e9a';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.fillStyle='#fff';x.fillRect(b.x-9,b.y-7,6,7);x.fillRect(b.x+4,b.y-7,6,7);roundRect(b.x-22,b.y-35,44,6,3,'#571e31');roundRect(b.x-22,b.y-35,44*Math.max(0,b.hp/b.max),6,3,'#ff6b76')}
if(hero){x.fillStyle='#203f9b';x.beginPath();x.arc(hero.x+3,hero.y+6,hero.r+3,0,7);x.fill();x.fillStyle=hero.inv>0?'#a8f7ff':'#318cf5';x.beginPath();x.arc(hero.x,hero.y,hero.r,0,7);x.fill();x.save();x.translate(hero.x,hero.y);x.rotate(aim());roundRect(12,-7,24,14,5,'#263b73');x.restore();x.fillStyle='#fff';x.beginPath();x.arc(hero.x-7,hero.y-5,4,0,7);x.arc(hero.x+7,hero.y-5,4,0,7);x.fill();roundRect(hero.x-26,hero.y-40,52,8,4,'#234b39');roundRect(hero.x-26,hero.y-40,52*Math.max(0,hero.hp/100),8,4,'#69f3a3')}
for(let p of particles){x.globalAlpha=Math.min(1,p.life*3);x.fillStyle=p.color;x.fillRect(p.x-3,p.y-3,6,6)}x.globalAlpha=1;x.restore()}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.querySelector('#start').onclick=reset;addEventListener('keydown',e=>{keys[e.key]=true;keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.code==='Space')superAttack()});addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){mouse.x=e.clientX;mouse.y=e.clientY}});c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){mouse.down=true;mouse.x=e.clientX;mouse.y=e.clientY}});addEventListener('pointerup',()=>mouse.down=false);
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let stickId=null;stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e)});function stickMove(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.max(1,Math.hypot(dx,dy));touchMove={x:dx/Math.max(45,m),y:dy/Math.max(45,m)};knob.style.transform='translate('+touchMove.x*35+'px,'+touchMove.y*35+'px)'}function stopStick(){stickId=null;touchMove={x:0,y:0};knob.style.transform=''}stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);
const fire=document.querySelector('#fire');fire.addEventListener('pointerdown',e=>{fire.setPointerCapture(e.pointerId);touchFire=true;touchAim={x:1,y:0}});fire.addEventListener('pointermove',e=>{if(!touchFire)return;let r=fire.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy);if(m>8)touchAim={x:dx/m,y:dy/m}});fire.addEventListener('pointerup',()=>touchFire=false);fire.addEventListener('pointercancel',()=>touchFire=false);document.querySelector('#super').addEventListener('pointerdown',e=>{e.preventDefault();superAttack()});
})();
</script></body></html>
